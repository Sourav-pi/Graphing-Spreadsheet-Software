name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      
    # These crates do not need the GUI's GTK/WebKit system dependencies.
    - name: Build core and CLI
      run: cargo build --locked -p cores -p cli --all-targets
      
    - name: Run core and CLI tests
      run: cargo test --locked -p cores -p cli
